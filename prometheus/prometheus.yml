global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "service-a"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["reverse-proxy-project-service-a-1:8000"]

  - job_name: "service-b"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["reverse-proxy-project-service-b-1:8000"]